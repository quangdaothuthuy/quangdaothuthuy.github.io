<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Slider</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="slider-container">
        <div class="slider" id="slider">
            <!-- Nhúng các slider HTML con từ thư mục "sliders" -->
            <iframe src="sliders/A1.html" class="slider-item" id="slide1"></iframe>
            <iframe src="sliders/A2.html" class="slider-item" id="slide2"></iframe>
            <iframe src="sliders/A3.html" class="slider-item" id="slide3"></iframe>
        </div>
    </div>

    <iframe src="match/index.html" class="section"></iframe>
    <div class="slogan">
        <img src="./assets/images/slogan.svg" class="slogan-image">
    </div>
    <div class="landing-page">
        <img src="./assets/images/landing_page.png" class="landing-page-image">
    </div>
    <div class="slogan" style="margin-top: 16px; margin-bottom: 32px;">
        <img src="./assets/images/invitation.svg" class="landing-page-image" style="width: 300px;">
        <img src="./assets/images/address.svg" class="landing-page-image" style="width: 300px; margin-top: 16px;">
        
        <img src="./assets/images/map.png" class="landing-page-image" style="width: 300px; margin-top: 24px;">
    </div>

    <!-- <iframe src="square/index.html" class="section" style="margin-top: 32px;"></iframe> -->

    <div class="square-container">
        <div class="grid">
            <div class="cell text-cell" style="background-color: #FDF7DF;">
                <img class="delay-1" src="./assets/images/you.svg">
            </div>
            <div class="cell">
                <img src="./assets/images/01.png">
            </div>
            <div class="cell text-cell" style="background-color: #C7BDFC;">
                <img class="spinning-element" src="./assets/images/02.png">
            </div>
            <div class="cell">
                <img src="./assets/images/10.png">
            </div>
            <div class="cell text-cell" style="background-color:#89360C;">
                <img class="delay-2" src="./assets/images/are.svg">
            </div>
            <div class="cell">
                <img src="./assets/images/12.png">
            </div>
            <div class="cell text-cell" style="background-color: #D6C84D;">
                <img class="spinning-element" src="./assets/images/20.png">
            </div>
            <div class="cell">
                <img src="./assets/images/21.png">
            </div>
            <div class="cell text-cell" style="background-color: #FDF7DF;">
                <img class="delay-3" src="./assets/images/invited.svg">
            </div>
        </div>  
    </div>

    <div class="contact-container">
        <div class="row" style="margin-top: 32px; margin-bottom: 32px;">
            <img class="star spinning-element" src="./assets/images/white_star.svg">
        </div>
        <div class="row" style="margin-bottom: 16px;" >
            <img class="desc" src="./assets/images/golden.svg">
        </div>
        <div class="row">
            <img class="qr" src="./assets/images/qr1.png">
        </div>
        <div class="row" style="margin-top: 16px; margin-bottom: 32px;">
            <img class="qr-text" src="./assets/images/text_qr_1.svg">
        </div>
        <div class="row">
            <img class="qr" src="./assets/images/qr2.png">
        </div>
        <div class="row" style="margin-top: 16px; margin-bottom: 32px;">
            <img class="qr-text" src="./assets/images/text_qr_2.svg">
        </div>
        <div class="row" style="margin-bottom: 32px;">
            <img class="star spinning-element" src="./assets/images/white_star_2.svg">
        </div>
        <div class="row">
            <img class="desc" src="./assets/images/happy.svg">
        </div>

        <div class="cl-end">
            <img class="icon spinning-element" src="./assets/images/Icon 9.svg">
            <img class="icon" src="./assets/images/Icon 8.svg">
            <img class="icon spinning-element" src="./assets/images/icon 2.svg">
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
